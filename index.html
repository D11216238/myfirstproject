        // Fisher-Yates 洗牌算法
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 抽牌功能
        function drawCards() {
            const question = document.getElementById('question').value.trim();
            const spreadId = document.getElementById('spread').value;
            const spread = SPREADS[spreadId];

            // 洗牌並抽取3張
            const shuffled = shuffleArray(CARDS);
            const drawnCards = shuffled.slice(0, 3);

            // 顯示結果
            displayResults(question, spread, drawnCards);
        }

        // 顯示結果
        function displayResults(question, spread, cards) {
            const resultsDiv = document.getElementById('results');
            const questionDisplay = document.getElementById('questionDisplay');
            const cardsContainer = document.getElementById('cardsContainer');
            const summarySection = document.getElementById('summarySection');
            const reflectionSection = document.getElementById('reflectionSection');

            // 顯示問題
            if (question) {
                questionDisplay.innerHTML = `<strong>你的問題：</strong>${question}`;
            } else {
                questionDisplay.innerHTML = `<strong>提示：</strong>未輸入問題，以下為一般性指引。`;
            }

            // 顯示牌卡
            cardsContainer.innerHTML = cards.map((card, index) => {
                const typeInfo = card.arcana === 'major' 
                    ? '大阿爾克那（Major Arcana）' 
                    : `小阿爾克那 - ${getSuitName(card.suit)}`;
                
                return `
                    <div class="card">
                        <div class="card-position">${spread.positions[index]}</div>
                        <div class="card-name">${card.name_zh}</div>
                        <div class="card-type">${typeInfo}</div>
                        <div class="card-keywords">
                            ${card.keywords.map(kw => `<span class="keyword">${kw}</span>`).join('')}
                        </div>
                        <div class="card-meaning">${card.core}</div>
                    </div>
                `;
            }).join('');

            // 生成綜合小結
            const summary = generateSummary(cards, spread);
            summarySection.innerHTML = `
                <h3>📊 綜合小結</h3>
                <p>${summary}</p>
            `;

            // 生成反思提問
            const reflections = generateReflections(cards, spread);
            reflectionSection.innerHTML = `
                <h3>💭 反思提問</h3>
                <ul>
                    ${reflections.map(r => `<li>${r}</li>`).join('')}
                </ul>
            `;

            // 顯示結果區域
            resultsDiv.classList.add('show');
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 取得花色中文名稱
        function getSuitName(suit) {
            const suitNames = {
                'wands': '權杖（行動/熱情）',
                'cups': '聖杯（情感/關係）',
                'swords': '寶劍（思考/溝通）',
                'pentacles': '錢幣（物質/資源）'
            };
            return suitNames[suit] || '';
        }

        // 生成綜合小結
        function generateSummary(cards, spread) {
            const majorCards = cards.filter(c => c.arcana === 'major');
            const minorCards = cards.filter(c => c.arcana === 'minor');

            let summary = '';

            // 如果有大牌，用大牌作為主題
            if (majorCards.length > 0) {
                const majorCard = majorCards[0];
                summary += `這次抽牌的核心主題圍繞在「${majorCard.name_zh}」，提醒你關注${majorCard.keywords[0]}與${majorCard.keywords[1]}的課題。`;
            } else {
                summary += `這次抽牌聚焦在日常生活的具體層面。`;
            }

            // 分析小牌的花色分布
            const suits = minorCards.map(c => c.suit).filter(s => s);
            const suitCounts = {};
            suits.forEach(s => suitCounts[s] = (suitCounts[s] || 0) + 1);

            if (suits.length > 0) {
                const dominantSuit = Object.keys(suitCounts).sort((a, b) => suitCounts[b] - suitCounts[a])[0];
                const suitAdvice = {
                    'wands': '在行動與目標推進上，保持熱情並採取具體步驟',
                    'cups': '在情感與關係中，關注內心的感受與他人的連結',
                    'swords': '在思考與溝通上，保持清晰並勇於面對真相',
                    'pentacles': '在工作與資源管理上，務實穩健地建立基礎'
                };
                summary += ` 建議你${suitAdvice[dominantSuit]}。`;
            }

            // 根據牌陣給出總結
            if (spread.id === 'past-present-future') {
                summary += ` 從過去的經驗中學習，活在當下並為未來做好準備。`;
            } else {
                summary += ` 認清阻礙，採納建議，就能看見可能的結果。`;
            }

            return summary;
        }

        // 生成反思提問
        function generateReflections(cards, spread) {
            const reflections = [];
            const majorCards = cards.filter(c => c.arcana === 'major');
            const suits = cards.map(c => c.suit).filter(s => s);

            // 根據牌陣類型提問
            if (spread.id === 'past-present-future') {
                reflections.push('從過去的經驗中，哪些模式正在重複出現？我能從中學到什麼？');
                reflections.push('我現在最需要關注的是什麼？有哪些資源或機會我尚未察覺？');
            } else {
                reflections.push('阻礙我前進的，是外在環境還是內在的恐懼與信念？');
                reflections.push('我願意採取哪些具體行動來改善現況？需要放下什麼才能前進？');
            }

            // 根據牌的特性添加提問
            if (majorCards.length > 0) {
                reflections.push('這個人生課題對我的長期發展有什麼意義？我準備好面對轉變了嗎？');
            }

            if (suits.includes('cups')) {
                reflections.push('在情感上，我是否真誠地面對自己的感受？我與他人的連結是否健康？');
            }

            if (suits.includes('swords')) {
                reflections.push('我的思考模式是幫助我還是限制我？有哪些信念需要重新檢視？');
            }

            if (suits.includes('pentacles')) {
                reflections.push('我是否忽略了身體的訊號或物質層面的需求？如何更務實地處理資源？');
            }

            // 隨機選擇2個提問
            const shuffledReflections = shuffleArray(reflections);
            return shuffledReflections.slice(0, 2);
        }

        // 重置功能
        function resetAll() {
            document.getElementById('question').value = '';
            document.getElementById('spread').selectedIndex = 0;
            document.getElementById('results').classList.remove('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        });
